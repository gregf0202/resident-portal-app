[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes to index.html.
# Real files (assets, version.json, icons) are served before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The update check must never be answered from a cache, or the app will keep
# being told the old build is current.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# index.html is the entry point and has to be revalidated every load, otherwise
# a stale copy keeps pointing at the previous build's JS.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Asset filenames are content-hashed by Vite, so a given URL can never change.
# Safe to cache hard, and it makes repeat loads much faster on mobile data.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
